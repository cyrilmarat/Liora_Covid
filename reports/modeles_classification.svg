<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Carte des modèles de classification pour le projet COVID</title>
<desc>Schéma classant les modèles ML/DL selon leur besoin en data augmentation et class weights</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Fond blanc pour export -->
<rect width="680" height="620" fill="white"/>

<!-- Titre -->
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="340" y="28" text-anchor="middle" fill="#2C2C2A">Modèles envisagés — besoins en pre-processing</text>

<!-- COLONNE GAUCHE : ML classique -->
<rect x="30" y="50" width="290" height="540" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="78" text-anchor="middle" fill="#2C2C2A">ML classique</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="96" text-anchor="middle" fill="#5F5E5A">features extraites (CSV)</text>

<!-- KNN -->
<rect x="50" y="115" width="250" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="140" text-anchor="middle" fill="#085041">K plus proches voisins (KNN)</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="158" text-anchor="middle" fill="#0F6E56">Distance euclidienne entre vecteurs</text>

<!-- SVM -->
<rect x="50" y="195" width="250" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="220" text-anchor="middle" fill="#085041">SVM</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="238" text-anchor="middle" fill="#0F6E56">Marge max entre classes</text>

<!-- Random Forest -->
<rect x="50" y="275" width="250" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="300" text-anchor="middle" fill="#085041">Forêt aléatoire</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="318" text-anchor="middle" fill="#0F6E56">Ensemble d'arbres de décision</text>

<!-- Besoins ML -->
<rect x="50" y="360" width="250" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="382" text-anchor="middle" fill="#633806">Besoins pre-processing</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="400" text-anchor="middle" fill="#854F0B">Class weights : conseillé</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="416" text-anchor="middle" fill="#854F0B">Data augmentation : non requis</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="432" text-anchor="middle" fill="#854F0B">Features CSV obligatoires</text>

<!-- Limite ML -->
<rect x="50" y="458" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="175" y="480" text-anchor="middle" fill="#712B13">Limite</text>
<text font-family="Arial, sans-serif" font-size="12" x="175" y="498" text-anchor="middle" fill="#993C1D">Risque biais extraction features</text>

<!-- COLONNE DROITE : Deep Learning -->
<rect x="360" y="50" width="290" height="540" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="78" text-anchor="middle" fill="#26215C">Deep Learning (CNN)</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="96" text-anchor="middle" fill="#534AB7">images directement en entrée</text>

<!-- CNN pré-entraînés -->
<rect x="380" y="115" width="250" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="138" text-anchor="middle" fill="#0C447C">CNN pré-entraînés</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="156" text-anchor="middle" fill="#185FA5">ResNet, DenseNet, MobileNet</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="172" text-anchor="middle" fill="#185FA5">VGG, Inception, Xception</text>

<!-- CNN personnalisé -->
<rect x="380" y="211" width="250" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="236" text-anchor="middle" fill="#0C447C">CNN personnalisé</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="254" text-anchor="middle" fill="#185FA5">Conv2D, Maxpooling2D (Keras)</text>

<!-- COVID-Net -->
<rect x="380" y="291" width="250" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="312" text-anchor="middle" fill="#0C447C">COVID-Net (référence)</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="328" text-anchor="middle" fill="#185FA5">Spécialisé radios pulmonaires</text>

<!-- Besoins DL -->
<rect x="380" y="356" width="250" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="378" text-anchor="middle" fill="#633806">Besoins pre-processing</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="396" text-anchor="middle" fill="#854F0B">Class weights : obligatoire</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="412" text-anchor="middle" fill="#854F0B">Data augmentation : recommandé</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="428" text-anchor="middle" fill="#854F0B">Masques + CLAHE : recommandé</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="444" text-anchor="middle" fill="#854F0B">Images 224×224 (ResNet/VGG)</text>

<!-- Avantage DL -->
<rect x="380" y="468" width="250" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text font-family="Arial, sans-serif" font-weight="500" font-size="14" x="505" y="488" text-anchor="middle" fill="#27500A">Avantage</text>
<text font-family="Arial, sans-serif" font-size="12" x="505" y="506" text-anchor="middle" fill="#3B6D11">Extraction auto des features</text>

<!-- Approche recommandée -->
<text font-family="Arial, sans-serif" font-size="12" x="340" y="605" text-anchor="middle" fill="#5F5E5A">Approche recommandée : baseline ML → CNN → transfer learning</text>

</svg>
